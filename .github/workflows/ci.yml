name: CI

on: 
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"
      - run: pytest

  training:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"
      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/


  utvardera:
    needs: training
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Testa kvalitetsgrinden
        env:
          MIN_ROC_AUC: "0.99"
        run: python -m churn.evaluate

      - name: Visa mätvärden i Summary
        if: always()
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Modellens mätvärden" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi