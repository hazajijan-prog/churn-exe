name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  schedule:
  - cron: "0 4 * * 1"
  - cron: "0 5 * * 1"

  workflow_dispatch:

jobs:
  tidkontroll:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.kolla.outputs.kor }}
    steps:
      - id: kolla
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ "$(TZ=Europe/Stockholm date +%H)" == "06" ]]; then
            echo "kor=true" >> "$GITHUB_OUTPUT"
          else
            echo "kor=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: tidkontroll
    if: needs.tidkontroll.outputs.kor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest

  training:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/


  utvardera:
    needs: training
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.evaluate

      - name: Visa mätvärden i Summary
        if: always()
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Modellens mätvärden" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  ringlista:
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skapa ringlista
        run: python -m churn.score

      - uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv